<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AURA — Adaptive Urban Response Assistant</title>
  <meta name="description" content="AURA coordinates citizen emergency reports, command center intelligence and responders. When every second matters." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="nav" id="nav">
    <a href="#/" class="brand" aria-label="AURA home">
      <span class="brand-mark"><span></span></span>
      <span class="brand-name">AURA</span>
    </a>
    <button class="nav-toggle" data-action="toggle-nav" aria-label="Open menu">☰</button>
    <nav class="nav-links" id="navLinks">
      <a href="#/command" data-route="command">Command Center</a>
      <a href="#/manage" data-route="manage">Incidents</a>
      <a href="#/citizen" data-route="citizen">Citizen Safety</a>
      <a href="#/responder" data-route="responder">Responder Portal</a>
      <a href="#/routing" data-route="routing">Smart Routing</a>
      <a href="#/traffic" data-route="traffic">Traffic Intel</a>
    </nav>
    <div class="nav-right">
      <div class="location-status" id="locationStatus" title="Your browser location is only accessed after you request it"><span class="location-dot"></span><span id="locationLabel">Location not set</span><button class="btn btn-sm" data-action="current-location">Use my location</button></div>
      <button class="icon-btn" data-action="toggle-notifs" aria-label="Notifications">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
        <span class="badge" id="notifCount" hidden>0</span>
      </button>
      <div class="avatar" title="Coordinator: Soumya">SC</div>
    </div>
    <div class="notif-panel" id="notifPanel" hidden></div>
  </header>

  <main id="app" tabindex="-1"></main>

  <div class="modal-backdrop" id="modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" id="modalBody"></div>
  </div>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="data.js"></script>
  <script src="engine.js"></script>
  <script src="app.js"></script>
</body>
</html>
